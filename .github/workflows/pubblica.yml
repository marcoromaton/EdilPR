# Pubblica l'app su GitHub Pages a ogni push su main.
# Pubblica SOLO la cartella src/preventivi (index.html + calcoli.js): il resto del repository non è raggiungibile dal link.
name: Pubblica
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/preventivi
      - id: deploy
        uses: actions/deploy-pages@v4
