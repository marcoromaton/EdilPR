name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nessun codice fiscale o IBAN nel repository
        run: bash scripts/controlla-dati-sensibili.sh --tutti
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dei calcoli
        run: node --test
